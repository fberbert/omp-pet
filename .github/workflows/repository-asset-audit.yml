name: Repository Asset Audit

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # PR-history audit needs the base commit's objects, so a shallow
          # single-commit checkout is not enough.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install
      - name: Test repository and asset contracts
        run: >-
          node --test
          test/package-build-config.test.js
          test/state-agent-icons.test.js
          test/tray-flash-icon.test.js
          test/repository-asset-audit.test.js
      - run: npm run audit:assets
      - name: Audit PR-reachable history for large binary assets
        if: github.event_name == 'pull_request'
        env:
          # Both event SHAs are validated as 40-hex inside the script and are
          # never spliced into a shell string.
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run audit:pr-history-assets
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repository-asset-audit
          path: dist/repository-asset-audit/*.json
